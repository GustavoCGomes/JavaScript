<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu primeiro programa...</title>
  <style>
    body {
      background-color: #bde139;
      color: rgb(28, 182, 36);
      font: normal 20pt Arial; /*Comentario no CSS*/
    }

    h1 {
      color: #2f2f73;
    }
  </style>
</head>
<body>
  <h1>Olá, mundo!</h1> <!--Isso é um comentario-->
  <p>Já me livrei da maldição</p>

  <script>
    var n1 = Number(window.prompt('Digite um número:'))
    var n2 = Number(window.prompt('Digite um número:'))
    var s = n1 + n2
    window.alert(`A soma dos valores é ${n1} + ${n2} é igual a ${s}`) // Concatenção
    // (number + number) para adição
    // (string + string) para concatenação
  </script>
</body>
</html>
