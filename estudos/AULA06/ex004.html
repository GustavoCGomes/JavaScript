<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      font: normal 25px Arial;
      background-color: rgb(88, 68, 106);
    }
  </style>
</head>
<body>
  <script>
    var nome = window.prompt('Qual é seu nome?')
    document.writeln(`Olá, ${nome}! Seu nome tem ${nome.length} letras. </br>`)
    document.writeln(`Seu nome em maiúsculas é ${nome.toUpperCase()} </br>`)
    document.writeln(`Seu nome em maiúsculas é ${nome.toLowerCase()}`)
  </script>
</body>
</html>
